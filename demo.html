        // PLAYER SCRIPT
        // Standalone Player Script - Matches editor.js behavior exactly
// Uses HTML elements (click-indicator) instead of canvas

let demoData = DEMO_DATA;
let currentStepIndex = 0;
let isPaused = false;

const video = document.getElementById('videoPlayer');
const clickIndicator = document.getElementById('clickIndicator');
const stepTooltip = document.getElementById('stepTooltip');
const tooltipCaption = document.getElementById('tooltipCaption');
const tooltipStepNum = document.getElementById('tooltipStepNum');
const continueOverlay = document.getElementById('continueOverlay');
const demoContainer = document.getElementById('demoContainer');

// Setup player on load
function setupPlayer() {
    currentStepIndex = -1;

    // Video time update - check for steps
    video.addEventListener('timeupdate', checkForStep);

    // Continue on click - ONLY on the indicator (like editor)
    clickIndicator.addEventListener('click', continueToNextStep);

    // Explicitly BLOCK clicks on the overlay to prevent advancing
    continueOverlay.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        console.log('Click on overlay blocked');
    });

    console.log('Player ready with', demoData.steps.length, 'steps');
}

// Check if current time matches a step
function checkForStep() {
    if (isPaused) return;

    const currentTime = video.currentTime;
    const nextStepIndex = currentStepIndex + 1;

    if (nextStepIndex < demoData.steps.length) {
        const stepTimestampSec = demoData.steps[nextStepIndex].timestamp / 1000;

        if (currentTime >= stepTimestampSec - 0.05) { // Tolerance
            pauseAtStep(nextStepIndex);
        }
    }
}

// Pause at a specific step
function pauseAtStep(index) {
    video.pause();
    isPaused = true;
    currentStepIndex = index;
    video.currentTime = demoData.steps[index].timestamp / 1000; // Seek to exact time

    showClickIndicator(demoData.steps[index]);
    showTooltip(demoData.steps[index], index);

    continueOverlay.classList.add('active');
}

// Show click indicator at correct position (EXACT COPY FROM EDITOR.JS)
function showClickIndicator(step) {
    // 1. Calculate ratio relative to the ORIGINAL viewport logic
    // We prefer step.viewportWidth if available, otherwise fallback to video native / dpr
    // Fallback for missing DPR: assume Retina (2) if video width > 2000px
    const dpr = step.devicePixelRatio || (video.videoWidth > 2000 ? 2 : 1);
    const originalViewportW = step.viewportWidth || (video.videoWidth / dpr);
    const originalViewportH = step.viewportHeight || (video.videoHeight / dpr);

    const ratioX = step.x / originalViewportW;
    const ratioY = step.y / originalViewportH;

    // 2. Calculate the ACTUAL displayed dimensions of the video image within the video element
    // The video element might be letterboxed (object-fit: contain) if its aspect ratio 
    // differs from the video source aspect ratio.

    const videoRect = video.getBoundingClientRect(); // The <video> element on screen
    const videoSourceAspect = video.videoWidth / video.videoHeight;
    const elementAspect = videoRect.width / videoRect.height;

    let displayW, displayH, offsetX, offsetY;

    // Check if letterboxing/pillarboxing is happening
    if (Math.abs(elementAspect - videoSourceAspect) > 0.01) {
        if (elementAspect > videoSourceAspect) {
            // Element is wider than video -> Pillarboxing (bars on sides)
            // Video takes full height
            displayH = videoRect.height;
            displayW = displayH * videoSourceAspect;
            offsetX = (videoRect.width - displayW) / 2;
            offsetY = 0;
        } else {
            // Element is taller than video -> Letterboxing (bars on top/bottom)
            // Video takes full width
            displayW = videoRect.width;
            displayH = displayW / videoSourceAspect;
            offsetX = 0;
            offsetY = (videoRect.height - displayH) / 2;
        }
    } else {
        // Matches, or close enough
        displayW = videoRect.width;
        displayH = videoRect.height;
        offsetX = 0;
        offsetY = 0;
    }

    // 3. Position relative to the container
    // The clickIndicator is absolute inside demoContainer.
    // We need to position it relative to the visual video content.
    // video.offsetLeft tells us where the video element starts inside the container.
    // offsetX/Y tells us where the video content starts inside the video element.

    const finalX = video.offsetLeft + offsetX + (ratioX * displayW);
    const finalY = video.offsetTop + offsetY + (ratioY * displayH);

    clickIndicator.style.left = finalX + 'px';
    clickIndicator.style.top = finalY + 'px';
    clickIndicator.classList.add('active');
}

// Show tooltip near click location (Relative to clickIndicator for safety)
function showTooltip(step, index) {
    // Force a reflow to ensure indicator position is ready
    const indicatorRect = clickIndicator.getBoundingClientRect();
    const containerRect = demoContainer.getBoundingClientRect();

    // Calculate center of the indicator relative to container
    const clickX = indicatorRect.left - containerRect.left + (indicatorRect.width / 2);
    const clickY = indicatorRect.top - containerRect.top + (indicatorRect.height / 2);

    // Initial safe defaults if calculation fails (e.g. hidden)
    if (indicatorRect.width === 0) {
        console.warn('Indicator not visible, fallback positioning');
        // Fallback to previous ratio logic could go here, but usually it works.
    }

    // Dimensions
    const tooltipWidth = 260; // Match CSS
    const tooltipHeight = 120;

    // Position: 110px to the right of CENTER
    let tooltipLeft = clickX + 110;
    let tooltipTop = clickY - 30;

    // Check right boundary
    if (tooltipLeft + tooltipWidth > containerRect.width - 10) {
        // Flip to left: 110px to left of CENTER
        tooltipLeft = clickX - tooltipWidth - 110;

        // If that forces it offscreen left, clamp?
        if (tooltipLeft < 10) tooltipLeft = 10;
    }

    // Check vertical boundaries
    if (tooltipTop < 10) tooltipTop = 10;
    if (tooltipTop + tooltipHeight > containerRect.height - 10) {
        tooltipTop = containerRect.height - tooltipHeight - 10;
    }

    // Update content
    tooltipStepNum.textContent = `Step ${index + 1} of ${demoData.steps.length}`;
    tooltipCaption.textContent = step.caption || `Step ${index + 1}`;

    stepTooltip.style.left = tooltipLeft + 'px';
    stepTooltip.style.top = tooltipTop + 'px';
    stepTooltip.classList.add('active');
}

// Hide step UI
function hideStepUI() {
    clickIndicator.classList.remove('active');
    stepTooltip.classList.remove('active');
    continueOverlay.classList.remove('active');
}

// Continue to next step
function continueToNextStep() {
    hideStepUI();
    isPaused = false;

    if (currentStepIndex < demoData.steps.length - 1) {
        video.play();
    } else {
        console.log('Demo complete!');
        video.play(); // Play to end
    }
}

// Auto-initialize
