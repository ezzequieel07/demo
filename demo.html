        .click-ripple {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            border: 3px solid #667eea;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.5);

            animation: ripple 1.5s ease-out infinite;

        .click-ripple.delay-1 {
            animation-delay: 0.5s;
        }

        .click-ripple.delay-2 {
            animation-delay: 1s;

        @keyframes ripple {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) scale(2.5);
                opacity: 0;
            }

        // Start demo from intro page
        function startDemo() {
            document.getElementById('introPage').classList.add('hidden');
            document.getElementById('videoPlayer').play();

        // PLAYER SCRIPT
        // Standalone Player Script - Matches editor.js behavior exactly
// Uses HTML elements (click-indicator) instead of canvas

let demoData = DEMO_DATA;
let currentStepIndex = 0;
let isPaused = false;

const video = document.getElementById('videoPlayer');
const clickIndicator = document.getElementById('clickIndicator');
const stepTooltip = document.getElementById('stepTooltip');
const tooltipCaption = document.getElementById('tooltipCaption');
const tooltipStepNum = document.getElementById('tooltipStepNum');
const continueOverlay = document.getElementById('continueOverlay');
const demoContainer = document.getElementById('demoContainer');

// Setup player on load
function setupPlayer() {
    currentStepIndex = -1;

    // Video time update - check for steps
    video.addEventListener('timeupdate', checkForStep);

    // Continue on click
    clickIndicator.addEventListener('click', continueToNextStep);
    continueOverlay.addEventListener('click', continueToNextStep);

    console.log('Player ready with', demoData.steps.length, 'steps');
}

// Check if current time matches a step
function checkForStep() {
    if (isPaused) return;

    const currentTime = video.currentTime;
    const nextStepIndex = currentStepIndex + 1;

    if (nextStepIndex < demoData.steps.length) {
        const stepTimestampSec = demoData.steps[nextStepIndex].timestamp / 1000;

        if (currentTime >= stepTimestampSec - 0.05) { // Tolerance
            pauseAtStep(nextStepIndex);
        }
    }
}

// Pause at a specific step
function pauseAtStep(index) {
    video.pause();
    isPaused = true;
    currentStepIndex = index;
    video.currentTime = demoData.steps[index].timestamp / 1000; // Seek to exact time

    showClickIndicator(demoData.steps[index]);
    showTooltip(demoData.steps[index], index);

    continueOverlay.classList.add('active');
}

// Show click indicator at correct position (SAME AS EDITOR)
function showClickIndicator(step) {
    const container = demoContainer;
    const videoEl = document.getElementById('videoPlayer');

    // Get actual video content dimensions (accounting for letterboxing)
    const containerWidth = container.clientWidth;
    const containerHeight = container.clientHeight;
    const videoAspect = videoEl.videoWidth / videoEl.videoHeight;
    const containerAspect = containerWidth / containerHeight;

    let displayW, displayH, offsetX, offsetY;

    if (containerAspect > videoAspect) {
        // Pillarboxing (black bars on sides)
        displayH = containerHeight;
        displayW = displayH * videoAspect;
        offsetX = (containerWidth - displayW) / 2;
        offsetY = 0;
    } else {
        // Letterboxing (black bars top/bottom)
        displayW = containerWidth;
        displayH = displayW / videoAspect;
        offsetX = 0;
        offsetY = (containerHeight - displayH) / 2;
    }

    // Calculate position ratio
    const ratioX = step.x / step.viewportWidth;
    const ratioY = step.y / step.viewportHeight;

    // Final position
    const finalX = videoEl.offsetLeft + offsetX + (ratioX * displayW);
    const finalY = videoEl.offsetTop + offsetY + (ratioY * displayH);

    clickIndicator.style.left = finalX + 'px';
    clickIndicator.style.top = finalY + 'px';
    clickIndicator.classList.add('active');
}

// Show tooltip near click location (SAME AS EDITOR)
function showTooltip(step, index) {
    const container = demoContainer;
    const videoEl = document.getElementById('videoPlayer');

    // Same calculation as click indicator
    const containerWidth = container.clientWidth;
    const containerHeight = container.clientHeight;
    const videoAspect = videoEl.videoWidth / videoEl.videoHeight;
    const containerAspect = containerWidth / containerHeight;

    let displayW, displayH, offsetX, offsetY;

    if (containerAspect > videoAspect) {
        displayH = containerHeight;
        displayW = displayH * videoAspect;
        offsetX = (containerWidth - displayW) / 2;
        offsetY = 0;
    } else {
        displayW = containerWidth;
        displayH = displayW / videoAspect;
        offsetX = 0;
        offsetY = (containerHeight - displayH) / 2;
    }

    const ratioX = step.x / step.viewportWidth;
    const ratioY = step.y / step.viewportHeight;

    const clickX = videoEl.offsetLeft + offsetX + (ratioX * displayW);
    const clickY = videoEl.offsetTop + offsetY + (ratioY * displayH);

    // Position tooltip offset from click
    let tooltipX = clickX + 50;
    let tooltipY = clickY - 30;

    // Boundary checks
    const tooltipRect = stepTooltip.getBoundingClientRect();
    if (tooltipX + tooltipRect.width > container.clientWidth) {
        tooltipX = clickX - tooltipRect.width - 50;
    }
    if (tooltipY < 0) {
        tooltipY = 20;
    }

    // Update content
    tooltipStepNum.textContent = `Step ${step.stepNumber} of ${demoData.steps.length}`;
    tooltipCaption.textContent = step.caption || `Step ${step.stepNumber}`;

    stepTooltip.style.left = tooltipX + 'px';
    stepTooltip.style.top = tooltipY + 'px';
    stepTooltip.classList.add('active');
}

// Hide step UI
function hideStepUI() {
    clickIndicator.classList.remove('active');
    stepTooltip.classList.remove('active');
    continueOverlay.classList.remove('active');
}

// Continue to next step
function continueToNextStep() {
    hideStepUI();
    isPaused = false;

    if (currentStepIndex < demoData.steps.length - 1) {
        video.play();
    } else {
        console.log('Demo complete!');
        video.play(); // Play to end
    }
}

// Initialize when video metadata loads
video.addEventListener('loadedmetadata', () => {
    console.log('Video loaded:', {
        width: video.videoWidth,
        height: video.videoHeight,
        duration: video.duration
    });
});

// Auto-initialize
setupPlayer();
